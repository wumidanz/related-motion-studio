<!doctype html>
<html lang="en">
<head>

<title>Welcome · Related Motion Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0908;
    --cream: rgb(246, 239, 226);
    --pad-x: 7.5dvh;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --serif: 'Playfair Display', 'Times New Roman', serif;
    --sans: 'Geist', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; overflow: hidden; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }
  @media (max-aspect-ratio: 1/1) { :root { --pad-x: 2.2dvh; } }

  .stage { position: relative; height: 100dvh; width: 100%; overflow: hidden; user-select: none; touch-action: none; }
  @media (pointer: fine) { .stage { cursor: none; } }

  /* ---------- track + cards ---------- */
  .track { position: absolute; inset: 0 0 auto 0; padding: 0 var(--pad-x); will-change: transform; }
  .slot { position: relative; width: 100%; height: 80dvh; margin-bottom: 5dvh; perspective: 2000px; }
  .card {
    position: relative; height: 100%; width: 100%; overflow: hidden; border-radius: 48px;
    transform-origin: 0% 50%; transform-style: preserve-3d; background: #141210;
    transition: transform 700ms var(--ease), box-shadow 700ms var(--ease);
  }
  .slot.is-open .card { transform: rotateY(15deg); box-shadow: 0 30px 80px -20px rgba(0,0,0,.8); }
  .card-media {
    position: absolute; top: 50%; left: 50%; width: 100vw; height: 120dvh;
    margin-top: -60dvh; margin-left: -50vw; will-change: transform;
  }
  .card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-media::before { content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.06) 22%, rgba(0,0,0,.04) 70%, rgba(0,0,0,.55) 100%); }
  .card-media::after { content: ""; position: absolute; inset: 0; z-index: 1;
    background: radial-gradient(80% 70% at 50% 50%, transparent 40%, rgba(0,0,0,.45) 100%); }

  .card-content { position: absolute; inset: 0; opacity: 0; filter: blur(16px); will-change: opacity, filter, transform; }
  .tl { position: absolute; left: 6dvh; top: 5.5dvh; display: flex; flex-direction: column; gap: 12px; }
  .kicker { font-family: var(--serif); font-style: italic; font-size: clamp(1.2rem, 2.4dvh, 2.4rem); line-height: 1; color: rgba(255,255,255,.9); }
  .micro { font-size: 10px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; }
  .eyebrow { color: rgba(255,255,255,.65); max-width: 26ch; line-height: 1.7; }
  .badge { margin-top: 12px; display: inline-flex; align-items: center; gap: 10px; padding: 7px 14px 7px 10px;
    border: 1px solid rgba(255,255,255,.22); border-radius: 999px; width: fit-content; }
  .badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--cream); box-shadow: 0 0 0 0 rgba(246,239,226,.6); animation: ping 2.4s ease-out infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(246,239,226,.55); } 100% { box-shadow: 0 0 0 10px rgba(246,239,226,0); } }

  .bl { position: absolute; left: 6dvh; bottom: 9dvh; display: flex; flex-direction: column; gap: 20px; }
  .category { color: rgba(255,255,255,.55); letter-spacing: .4em; }
  .title { margin: 0; font-family: var(--serif); font-weight: 600; text-transform: uppercase; color: var(--cream);
    font-size: clamp(2.2rem, 8.5dvh, 9rem); line-height: .92; letter-spacing: -.02em; }
  .title span { display: block; }
  .meta { display: flex; flex-direction: column; gap: 6px; }
  .meta div { display: flex; gap: 12px; align-items: baseline; }
  .meta b { font-weight: 500; color: rgba(255,255,255,.45); }
  .meta span { color: rgba(255,255,255,.9); }

  .rc { position: absolute; right: 6dvh; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 28px; }
  .hl { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; }
  .hl .micro { font-size: 9.5px; color: rgba(255,255,255,.55); }
  .hl q { font-family: var(--serif); font-style: italic; font-size: 16px; line-height: 1.25; color: rgba(255,255,255,.95); max-width: 18ch; quotes: "“" "”"; }
  .rule { width: 22px; height: 1px; background: rgba(255,255,255,.4); }

  .explore {
    position: absolute; right: 6dvh; bottom: 5dvh; display: flex; align-items: center; gap: 16px; overflow: hidden;
    padding: 16px 28px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); background: rgba(10,9,8,.25);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: pointer;
    font-size: 12px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase;
  }
  .explore::before { content: ""; position: absolute; inset: 0; border-radius: 999px; transform: translateX(-100%);
    background: linear-gradient(90deg, rgba(255,255,255,.02), rgba(255,255,255,.12), rgba(255,255,255,.02)); transition: transform .5s ease-out; }
  .explore:hover::before { transform: translateX(0); }
  .explore em { font-style: normal; font-size: 15px; transition: transform .3s ease-out; }
  .explore:hover em { transform: translateX(6px); }
  .explore > * { position: relative; }

  @media (max-aspect-ratio: 1/1) {
    .tl { left: 3dvh; top: 3dvh; gap: 8px; }
    .bl { left: 3dvh; bottom: 12dvh; gap: 12px; right: 3dvh; }
    .rc, .badge { display: none; }
    .explore { left: 3dvh; right: auto; bottom: 3dvh; padding: 14px 22px; }
    .card { border-radius: 32px; }
  }

  /* ---------- chrome ---------- */
  .fade { position: absolute; inset-inline: 0; height: 10dvh; z-index: 30; pointer-events: none; }
  .fade.top { top: 0; background: linear-gradient(var(--bg), rgba(10,9,8,0)); }
  .fade.bot { bottom: 0; background: linear-gradient(0deg, var(--bg), rgba(10,9,8,0)); }

  .scan { position: absolute; inset: 0; z-index: 60; pointer-events: none; background: var(--bg); transition: opacity 1.4s ease; }
  .scan::after { content: ""; position: absolute; inset: 0; opacity: .5;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); }
  .scan.off { opacity: 0; }

  .topbar { position: absolute; top: 2.6dvh; left: var(--pad-x); right: var(--pad-x); z-index: 45; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  .brand { display: flex; align-items: baseline; gap: 10px; padding-left: 6dvh; }
  .brand b { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .brand span { font-size: 10px; letter-spacing: .32em; text-transform: uppercase; color: rgba(255,255,255,.55); }
  .checkin-btn {
    pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--cream); color: #0a0908; font-size: 12px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase;
    box-shadow: 0 10px 40px -10px rgba(246,239,226,.35); transition: transform .3s var(--ease);
  }
  .checkin-btn:hover { transform: translateY(-2px); }
  .checkin-btn i { width: 7px; height: 7px; border-radius: 50%; background: #0a0908; animation: ping2 2.2s ease-out infinite; }
  @keyframes ping2 { 0% { box-shadow: 0 0 0 0 rgba(10,9,8,.5); } 100% { box-shadow: 0 0 0 9px rgba(10,9,8,0); } }
  @media (max-aspect-ratio: 1/1) { .brand { padding-left: 1dvh; } .brand span { display: none; } }

  .pager { position: absolute; right: 3.2dvh; top: 50%; transform: translateY(-50%); z-index: 40; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; transition: opacity .4s ease; }
  .pager .n { font-family: var(--serif); font-style: italic; font-size: 12px; color: rgba(255,255,255,.55); }
  .pager .n.total { color: rgba(255,255,255,.35); }
  .pager .dots { display: flex; flex-direction: column; align-items: center; }
  .pager button { width: 20px; height: 20px; display: grid; place-items: center; background: none; border: 0; padding: 0; cursor: pointer; }
  .pager button span { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,.22); transition: all 320ms cubic-bezier(0.16, 1, 0.3, 1); }
  .pager button.on span { width: 6px; height: 6px; background: rgba(241,231,210,.95); }
  .hidden { opacity: 0; pointer-events: none; }
  @media (max-aspect-ratio: 1/1) { .pager { right: 1dvh; } }

  .hint { position: absolute; bottom: 2.4dvh; left: 50%; transform: translateX(-50%); z-index: 40; color: rgba(255,255,255,.4); white-space: nowrap; transition: opacity .6s ease; }
  @media (max-aspect-ratio: 1/1) { .hint { display: none; } }

  .cursor { position: fixed; left: 0; top: 0; width: 104px; height: 104px; z-index: 90; pointer-events: none; opacity: 0; will-change: transform, opacity; }
  .cursor .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,.45); }
  .cursor .lab { position: absolute; inset: 0; display: grid; place-items: center; transition: opacity 180ms; }
  .cursor .arr { position: absolute; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 160ms; font-size: 14px; }
  .cursor .arr.up { bottom: calc(100% + 10px); }
  .cursor .arr.dn { top: calc(100% + 10px); }
  @media (pointer: coarse) { .cursor { display: none; } }

  /* ---------- panel ---------- */
  .veil { position: absolute; z-index: 48; top: 10dvh; height: 80dvh; left: var(--pad-x); right: var(--pad-x); border-radius: 48px;
    background: rgba(10,9,8,0); backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); pointer-events: none;
    transition: background-color 600ms var(--ease), backdrop-filter 600ms var(--ease), -webkit-backdrop-filter 600ms var(--ease); }
  .veil.on { background: rgba(10,9,8,.35); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); pointer-events: auto; }
  .panel {
    position: absolute; z-index: 50; top: 10dvh; height: 80dvh; right: var(--pad-x); width: min(640px, 52%);
    border-radius: 48px; overflow: hidden; display: flex; flex-direction: column; color: #fff;
    background: linear-gradient(180deg, rgba(18,16,14,.85), rgba(10,9,8,.92));
    backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid rgba(255,255,255,.08);
    transform: translateX(calc(100% + var(--pad-x) + 2dvh)); transition: transform 700ms var(--ease); will-change: transform;
    cursor: auto; user-select: text; touch-action: pan-y;
  }
  .panel.on { transform: translateX(0); }
  @media (max-aspect-ratio: 1/1) { .panel { width: calc(100vw - 2 * var(--pad-x)); border-radius: 32px; } .veil { border-radius: 32px; } }
  .panel-scroll { overflow-y: auto; padding: 5dvh 5dvh 4dvh; flex: 1; overscroll-behavior: contain; }
  .close { position: absolute; top: 3dvh; right: 3dvh; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.04); cursor: pointer; z-index: 2; font-size: 16px; }
  .p-eyebrow { color: rgba(255,255,255,.55); }
  .p-title { font-family: var(--serif); font-weight: 600; text-transform: uppercase; font-size: clamp(2rem, 5.2dvh, 3.6rem); line-height: .95; letter-spacing: -.02em; margin: 14px 0 0; color: var(--cream); }
  .p-sub { margin-top: 14px; color: rgba(255,255,255,.6); }
  .hr { height: 1px; background: rgba(255,255,255,.1); margin: 24px 0; }
  .p-body { font-family: var(--serif); font-style: italic; font-size: 16px; line-height: 1.65; color: rgba(255,255,255,.85); margin: 0; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .stat .micro { font-size: 9.5px; color: rgba(255,255,255,.45); }
  .stat div:last-child { font-family: var(--serif); font-size: 19px; margin-top: 6px; color: rgba(255,255,255,.95); }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 22px; border-radius: 999px; cursor: pointer;
    font-size: 11.5px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; border: 1px solid rgba(255,255,255,.28); background: transparent; }
  .btn.solid { background: var(--cream); color: #0a0908; border-color: var(--cream); }
  .qr-row { display: flex; gap: 20px; align-items: center; }
  .qr { width: 104px; height: 104px; padding: 8px; background: #fff; border-radius: 14px; flex: none; }
  .qr img, .qr canvas { width: 100% !important; height: 100% !important; display: block; }
  .qr-row p { margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.65); }

  /* form */
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .field label { font-size: 10px; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; color: rgba(255,255,255,.5); }
  .field label em { font-style: normal; color: var(--cream); }
  .field input, .field select {
    height: 54px; padding: 0 2px; background: transparent; border: 0; border-bottom: 1px solid rgba(255,255,255,.2);
    font-size: 18px; outline: none; border-radius: 0; color-scheme: dark; transition: border-color .3s ease;
  }
  .field input:focus, .field select:focus { border-bottom-color: var(--cream); }
  .field input::placeholder { color: rgba(255,255,255,.28); }
  .field select option { background: #141210; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
  @media (max-width: 620px) { .row2 { grid-template-columns: 1fr; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: inline-flex; align-items: center; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.2);
    font-size: 13px; color: rgba(255,255,255,.8); cursor: pointer; transition: all .25s ease; }
  .chip input:checked + span { background: var(--cream); color: #0a0908; border-color: var(--cream); }
  .consent { display: flex; gap: 12px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.7); margin: 6px 0 22px; cursor: pointer; }
  .consent input { width: 22px; height: 22px; accent-color: var(--cream); flex: none; margin-top: 1px; }
  .err { color: #e8a27c; font-size: 13px; min-height: 18px; margin-bottom: 12px; }
  .done { text-align: left; }
  .done .p-title { font-size: clamp(2.2rem, 6dvh, 4rem); }
  .count { font-family: var(--serif); font-style: italic; color: rgba(255,255,255,.45); font-size: 14px; margin-top: 22px; }

  [data-reveal] { will-change: transform, opacity, filter; }
  @media (prefers-reduced-motion: reduce) {
    .card, .panel, .veil { transition-duration: 1ms !important; }
  }
</style>
</head>
<body>

<main class="stage" id="stage" aria-roledescription="carousel">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs><filter id="mblur" x="-5%" y="-25%" width="110%" height="150%"><feGaussianBlur id="mblurDev" in="SourceGraphic" stdDeviation="0 0" /></filter></defs>
  </svg>

  <div class="track" id="track"></div>

  <div class="fade top"></div>
  <div class="fade bot"></div>

  <header class="topbar">
    <div class="brand"><b>related</b><span>motion studio · welcome</span></div>
    <button class="checkin-btn" id="checkinBtn" data-no-drag type="button"><i></i>Check in</button>
  </header>

  <nav class="pager" id="pager" data-no-drag aria-label="Slides">
    <div class="n" id="pagerCur">01</div>

    <div class="n total" id="pagerTotal">01</div>

  <div class="hint micro" id="hint">Drag · scroll · tap explore</div>

  <div class="veil" id="veil"></div>
  <aside class="panel" id="panel" data-no-drag aria-hidden="true">
    <button class="close" id="closeBtn" type="button" aria-label="Close">✕</button>
    <div class="panel-scroll" id="panelBody"></div>
  </aside>

  <div class="cursor" id="cursor" aria-hidden="true">
    <div class="ring"></div>
    <div class="lab micro" id="cursorLab">Scroll</div>
    <div class="arr up" id="arrUp">↑</div>
    <div class="arr dn" id="arrDn">↓</div>
  </div>

  <div class="scan" id="scan"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* =====================================================================
   CONTENT — swap images/text here. Everything else reads from this.

const SLIDES = [

    stats: [['Status', 'Coming soon'], ['Focus', 'Editorial'], ['Style', 'Glamour'], ['Where', 'RMS Studio'], ['Updates', 'Check in'], ['Launch', 'Soon']],
    img: '../products/rms-frames/assets/bg1.webp',
  },
];

const SPACES_BOOKED = ['Main Studio', 'The Artisan Hall', 'Bathhouse', 'Mansion Entrance', 'Seminar Room', 'Outdoor Environment', 'A Space set world', 'Not sure yet'];
const INTERESTS = ['New launches', 'Offers & discounts', 'Space bookings', 'RMS Academy', 'Trybe community', 'Brand films & campaigns'];

/* =====================================================================
   ENGINE
   ===================================================================== */
const N = SLIDES.length, COPIES = 7, TOTAL = N * COPIES;
const $ = (id) => document.getElementById(id);
const stage = $('stage'), track = $('track'), blurDev = $('mblurDev');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function slideHTML(s) {
  return `
    <div class="card">
      <div class="card-media"><img src="${s.img}" alt="${esc(s.name)}" draggable="false" decoding="async" /></div>
      <div class="card-content">
        <div class="tl" data-reveal>
          <div class="kicker">${esc(s.kicker)}</div>
          <div class="micro eyebrow">${esc(s.eyebrow)}</div>
          <div class="badge micro"><i></i>${esc(s.badge)}</div>
        </div>
        <div class="bl">
          <div class="micro category" data-reveal>${esc(s.category)}</div>
          <h2 class="title" data-reveal>${s.titleLines.map((l) => `<span>${esc(l)}</span>`).join('')}</h2>
          <div class="meta micro" data-reveal>${s.meta.map(([k, v]) => `<div><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div>
        </div>
        <div class="rc" data-reveal>
          ${s.highlights.map(([k, v]) => `<div class="hl"><div class="rule"></div><div class="micro">${esc(k)}</div><q>${esc(v)}</q></div>`).join('')}
        </div>
        <button class="explore" type="button" data-no-drag data-explore><span>Explore</span><em>→</em></button>
      </div>
    </div>`;
}

const slots = [];
for (let i = 0; i < TOTAL; i++) {
  const s = SLIDES[i % N];
  const el = document.createElement('div');
  el.className = 'slot';
  el.innerHTML = slideHTML(s);
  el.__media = el.querySelector('.card-media');
  el.__content = el.querySelector('.card-content');
  el.querySelector('[data-explore]').addEventListener('click', (e) => { e.stopPropagation(); openExplore(i); });
  track.appendChild(el);
  slots.push(el);
}

// pager
$('pagerTotal').textContent = String(N).padStart(2, '0');
const dots = SLIDES.map((_, k) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.setAttribute('aria-label', 'Go to slide ' + (k + 1));
  b.innerHTML = '<span></span>';
  b.addEventListener('click', (e) => { e.stopPropagation(); poke(); const cur = mod(idx); let d = k - cur; if (d > N / 2) d -= N; if (d < -N / 2) d += N; go(idx + d); });
  $('pagerDots').appendChild(b);
  return b;
});
const mod = (i) => ((i % N) + N) % N;

// geometry
let VH = innerHeight / 100, cardH = 80 * VH, slotH = 85 * VH, topPad = 10 * VH, measuredH = innerHeight;
function measure() { measuredH = innerHeight; VH = innerHeight / 100; cardH = 80 * VH; slotH = 85 * VH; topPad = 10 * VH; y = target = topPad - idx * slotH; }
addEventListener('resize', measure);

let idx = 3 * N, prevIdx = idx;
let y = topPad - idx * slotH, target = y;
let intro = !reduced, introHidden = !reduced;
let lastActiveShown = -1;

function go(i) {
  if (intro || openSlot !== null) return;
  prevIdx = idx; idx = i;
  target = topPad - idx * slotH;
  updatePager();
}
function updatePager() {
  const k = mod(idx);
  $('pagerCur').textContent = String(k + 1).padStart(2, '0');
  dots.forEach((d, j) => d.classList.toggle('on', j === k));
}
updatePager();

// ---------- input ----------
let lastInteract = performance.now(), lastAuto = 0, wheelLock = 0;
function poke() { lastInteract = performance.now(); $('hint').style.opacity = ''; }

stage.addEventListener('wheel', (e) => {
  e.preventDefault(); poke();
  if (openSlot !== null || panelMode) return;
  const now = performance.now();
  if (now < wheelLock || Math.abs(e.deltaY) < 4) return;
  wheelLock = now + 720;
  go(idx + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });

addEventListener('keydown', (e) => {
  poke();
  if (e.key === 'Escape') { closePanel(); return; }
  if (panelMode) return;
  if (['ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(idx + 1); }
  if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(idx - 1); }
});

const drag = { active: false, startY: 0, startTrack: 0, delta: 0, id: 0 };
let edge = null, hovering = false, noDrag = false, pointer = { x: 0, y: 0 };

stage.addEventListener('pointerdown', (e) => {
  poke();
  if (e.target.closest('[data-no-drag]') || intro || panelMode) return;
  drag.active = true; drag.startY = e.clientY; drag.startTrack = y; drag.delta = 0; drag.id = e.pointerId;
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
});
stage.addEventListener('pointermove', (e) => {
  pointer.x = e.clientX; pointer.y = e.clientY; hovering = true;
  noDrag = !!e.target.closest('[data-no-drag]');
  edge = e.clientY < 10 * VH ? 'top' : e.clientY > innerHeight - 10 * VH ? 'bottom' : null;
  if (!drag.active) return;
  poke();
  drag.delta = e.clientY - drag.startY;
  y = drag.startTrack + drag.delta;
});
function endDrag(commit) {
  if (!drag.active) return;
  drag.active = false;
  try { stage.releasePointerCapture(drag.id); } catch (_) {}
  const d = drag.delta;
  if (!commit) return;
  if (edge && Math.abs(d) < 8) { go(idx + (edge === 'top' ? -1 : 1)); return; }
  if (Math.abs(d) > Math.min(120, 12 * VH)) go(idx + (d < 0 ? 1 : -1));
}
stage.addEventListener('pointerup', () => endDrag(true));
stage.addEventListener('pointercancel', () => endDrag(false));
stage.addEventListener('pointerleave', () => { hovering = false; endDrag(true); });
stage.addEventListener('pointerenter', () => { hovering = true; });

// ---------- render loop ----------
const smooth = (t) => t * t * (3 - 2 * t);
const cursorEl = $('cursor'), cur = { x: 0, y: 0, s: 1, o: 0, init: false };

function frame(now) {
  // Kiosk tablets rotate and browsers sometimes skip resize events.
  if (!intro && !drag.active && innerHeight !== measuredH) measure();
  if (!intro && !drag.active) {
    const d = target - y;
    y = Math.abs(d) < 0.5 ? target : y + d * 0.11;
    // seamless loop rebase once settled
    if (y === target && (idx < 2 * N || idx >= 5 * N)) {
      const shift = idx < 2 * N ? N : -N;
      idx += shift; prevIdx += shift; y -= shift * slotH; target = y;
    }
  }
  track.style.transform = `translate3d(0, ${y.toFixed(2)}px, 0)`;

  const half = innerHeight / 2;
  for (let i = 0; i < TOTAL; i++) {
    const el = slots[i];
    const r = i * slotH + y + cardH / 2 - half;
    const a = Math.abs(r) / cardH;
    if (a > 2.2) {
      if (el.__on) { el.__content.style.opacity = '0'; el.__content.style.filter = 'blur(16px)'; el.__on = false; }
      continue;
    }
    el.__on = true;
    el.__media.style.transform = `translate3d(0, ${(-r / 1.2).toFixed(2)}px, 0)`;
    const c = el.__content;
    if (introHidden) { c.style.opacity = '0'; continue; }
    let m = 0, blur = 16, ty = 0;
    if (i === idx) { const t = Math.max(0, Math.min(1, 1 - a / 0.55)); m = smooth(t); blur = (1 - m) * 14; ty = (1 - m) * 64 * Math.sign(r || 1); }
    else if (i === prevIdx) { m = Math.max(0, 1 - Math.max(0, a - 0.6) / 0.6); blur = (1 - m) * 6; ty = -0.42 * r; }
    c.style.opacity = m.toFixed(3);
    c.style.filter = `blur(${blur.toFixed(2)}px)`;
    c.style.transform = `translate3d(0, ${ty.toFixed(2)}px, 0)`;
  }

  // cursor
  if (!cur.init && (pointer.x || pointer.y)) { cur.x = pointer.x; cur.y = pointer.y; cur.init = true; }
  cur.x += (pointer.x - cur.x) * 0.22; cur.y += (pointer.y - cur.y) * 0.22;
  const showCursor = hovering && cur.init && !noDrag && !panelMode;
  cur.o += ((showCursor ? 1 : 0) - cur.o) * 0.18;
  cur.s += ((drag.active ? 1.18 : 1) - cur.s) * 0.22;
  cursorEl.style.transform = `translate3d(${cur.x}px, ${cur.y}px, 0) translate(-50%, -50%) scale(${cur.s.toFixed(3)})`;
  cursorEl.style.opacity = cur.o.toFixed(3);
  $('cursorLab').textContent = drag.active ? 'Drag' : 'Scroll';
  $('arrUp').style.opacity = edge === 'top' ? '1' : '0';
  $('arrDn').style.opacity = edge === 'bottom' ? '1' : '0';

  // kiosk autoplay + reset
  const idle = now - lastInteract;
  if (!intro && !panelMode && idle > IDLE_AUTOPLAY_MS && now - lastAuto > AUTOPLAY_EVERY_MS) { lastAuto = now; go(idx + 1); $('hint').style.opacity = '0'; }
  if (panelMode && idle > IDLE_RESET_MS) { closePanel(); resetForm(); }

  requestAnimationFrame(frame);
}

// ---------- intro: the reel rolls in ----------
function revealActive(i) {
  const els = slots[i].querySelectorAll('[data-reveal]');
  els.forEach((el, k) => {
    el.animate(
      [{ opacity: 0, transform: 'translateY(32px)', filter: 'blur(10px)' }, { opacity: 1, transform: 'translateY(0)', filter: 'blur(0)' }],
      { duration: 1000, delay: k * 70, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'backwards' }
    );
  });
}
function runIntro() {
  if (reduced) { $('scan').classList.add('off'); return; }
  const from = idx - 2 * N, to = idx;
  const y0 = topPad - from * slotH, y1 = topPad - to * slotH;
  const dur = 3000, t0 = performance.now();
  let lastY = y0, lastT = t0;
  track.style.filter = 'url(#mblur)';
  setTimeout(() => $('scan').classList.add('off'), 250);
  const step = (now) => {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3); // power3.out
    y = y0 + (y1 - y0) * e;
    const v = Math.abs(y - lastY) / Math.max(1, now - lastT);
    blurDev.setAttribute('stdDeviation', `0 ${Math.min(18, v * 2.2).toFixed(2)}`);
    lastY = y; lastT = now;
    if (p < 1) return requestAnimationFrame(step);
    y = target = y1;
    blurDev.setAttribute('stdDeviation', '0 0');
    track.style.filter = '';
    intro = false; introHidden = false;
    revealActive(idx);
    poke();
  };
  requestAnimationFrame(step);
}

// ---------- panel: explore + check-in ----------
let openSlot = null, panelMode = null;
const panel = $('panel'), veil = $('veil'), body = $('panelBody');

function showPanel() {
  panel.classList.add('on'); veil.classList.add('on');
  panel.setAttribute('aria-hidden', 'false');
  $('pager').classList.add('hidden'); $('hint').classList.add('hidden');
  body.scrollTop = 0;
}
function closePanel() {
  if (!panelMode) return;
  panel.classList.remove('on'); veil.classList.remove('on');
  panel.setAttribute('aria-hidden', 'true');
  $('pager').classList.remove('hidden'); $('hint').classList.remove('hidden');
  if (openSlot !== null) slots[openSlot].classList.remove('is-open');
  openSlot = null; panelMode = null;
  if (doneTimer) { clearInterval(doneTimer); doneTimer = null; resetForm(); }
}
veil.addEventListener('click', () => { poke(); closePanel(); });
$('closeBtn').addEventListener('click', () => { poke(); closePanel(); });
panel.addEventListener('pointerdown', poke);
panel.addEventListener('input', poke);

function openExplore(i) {
  poke();
  if (intro || i !== idx) return;
  const s = SLIDES[i % N];
  openSlot = i; panelMode = 'explore';
  slots[i].classList.add('is-open');
  body.innerHTML = `
    <div class="micro p-eyebrow">${esc(s.eyebrow)}</div>
    <h3 class="p-title">${s.titleLines.map(esc).join('<br>')}</h3>
    <div class="micro p-sub">${s.meta.map(([k, v]) => esc(k) + ' · ' + esc(v)).join('&nbsp;&nbsp;&nbsp;')}</div>
    <div class="hr"></div>
    <p class="p-body">${esc(s.body)}</p>
    <div class="hr"></div>
    <div class="stats">${s.stats.map(([k, v]) => `<div class="stat"><div class="micro">${esc(k)}</div><div>${esc(v)}</div></div>`).join('')}</div>
    <div class="hr"></div>
    <div class="qr-row">
      <div class="qr" id="qrRates"></div>
      <div><div class="micro" style="color:rgba(255,255,255,.5)">Scan with your phone</div><p>Our full rate card — every space, every package.</p></div>
    </div>
    <div class="hr"></div>
    <div class="actions">
      <button class="btn solid" type="button" id="exploreCheckin">Check in with us →</button>
    </div>`;
  makeQR('qrRates', RATE_CARD_URL);
  $('exploreCheckin').addEventListener('click', () => { slots[i].classList.remove('is-open'); openSlot = null; openCheckin(); });
  showPanel();
}

function makeQR(id, text) {
  const el = $(id);
  if (!el) return;
  if (typeof QRCode === 'undefined') { el.parentElement.style.display = 'none'; return; }
  new QRCode(el, { text, width: 176, height: 176, colorDark: '#0a0908', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
}

$('checkinBtn').addEventListener('click', (e) => { e.stopPropagation(); openCheckin(); });

function formHTML() {
  return `
    <div class="micro p-eyebrow">Related Motion Studio · Guest check-in</div>
    <h3 class="p-title">Welcome in.<br><i style="font-weight:400;text-transform:none">Stay in the loop.</i></h3>
    <p class="p-sub" style="font-size:14px;letter-spacing:0;text-transform:none;line-height:1.6">Leave your details and we'll send you new launches, offers and first access — by email and WhatsApp.</p>
    <div class="hr"></div>
    <form id="guestForm" novalidate autocomplete="off">
      <div class="field"><label for="g-name">Full name <em>*</em></label><input id="g-name" name="name" required placeholder="Your name" /></div>
      <div class="row2">
        <div class="field"><label for="g-phone">WhatsApp number <em>*</em></label><input id="g-phone" name="phone" type="tel" inputmode="tel" required placeholder="0801 234 5678" /></div>
        <div class="field"><label for="g-email">Email <em>*</em></label><input id="g-email" name="email" type="email" inputmode="email" required placeholder="you@email.com" /></div>
      </div>
      <div class="row2">
        <div class="field"><label for="g-space">Space you booked</label>
          <select id="g-space" name="space_booked"><option value="">Select one</option>${SPACES_BOOKED.map((s) => `<option>${esc(s)}</option>`).join('')}</select></div>
        <div class="field"><label for="g-brand">Brand / company</label><input id="g-brand" name="brand" placeholder="Optional" /></div>
      </div>
      <div class="field"><label for="g-ig">Instagram</label><input id="g-ig" name="instagram" placeholder="@handle (optional)" autocapitalize="off" /></div>
      <div class="field"><label>What would you like to hear about?</label>
        <div class="chips">${INTERESTS.map((t) => `<label class="chip"><input type="checkbox" name="interests" value="${esc(t)}" /><span>${esc(t)}</span></label>`).join('')}</div>
      </div>
      <label class="consent"><input type="checkbox" name="consent" id="g-consent" required /><span>I'm happy for Related Motion Studio to send me updates by email and WhatsApp. I can opt out any time.</span></label>
      <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off" />
      <div class="err" id="gErr"></div>
      <div class="actions"><button class="btn solid" type="submit" id="gSubmit" style="min-width:220px">Check in →</button></div>
    </form>`;
}
let doneTimer = null;
function openCheckin() {
  poke();
  if (intro) return;
  if (panelMode !== 'checkin' || !$('guestForm')) body.innerHTML = formHTML();
  panelMode = 'checkin';
  wireForm();
  showPanel();
}
function resetForm() { if (panelMode !== 'checkin') body.innerHTML = ''; }

function wireForm() {
  const f = $('guestForm');
  if (!f || f.__wired) return;
  f.__wired = true;
  f.addEventListener('submit', async (e) => {
    e.preventDefault(); poke();
    const err = $('gErr');
    const d = new FormData(f);
    const name = String(d.get('name') || '').trim();
    const phone = String(d.get('phone') || '').replace(/[^\d+]/g, '');
    const email = String(d.get('email') || '').trim();
    if (!name) return (err.textContent = 'Please add your name.');
    if (phone.replace(/\D/g, '').length < 10) return (err.textContent = 'Please add a valid WhatsApp number.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return (err.textContent = 'Please add a valid email.');
    if (!d.get('consent')) return (err.textContent = 'Tick the box so we can send you updates.');
    if (d.get('botcheck')) return;
    err.textContent = '';
    const payload = {
      access_key: WEB3FORMS_KEY,
      subject: 'RMS Walk-in check-in — ' + name,
      from_name: 'RMS Studio kiosk',
      name, phone, email,
      space_booked: d.get('space_booked') || '—',
      brand: d.get('brand') || '—',
      instagram: d.get('instagram') || '—',
      interests: d.getAll('interests').join(', ') || '—',
      consent: 'Yes — email & WhatsApp updates',
      checked_in_at: new Date().toLocaleString('en-NG', { timeZone: 'Africa/Lagos' }),
    };
    const btn = $('gSubmit'); btn.disabled = true; btn.textContent = 'Checking in…';
    const ok = await send(payload);
    if (!ok) queue(payload);
    showDone(name.split(' ')[0]);
  });
}

async function send(payload) {
  try {
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(payload),
    });
    const j = await res.json().catch(() => ({}));
    return res.ok && j.success;
  } catch (_) { return false; }
}
// Offline-safe: a kiosk on flaky Wi-Fi keeps check-ins and retries later.
const QKEY = 'rms-checkin-queue';
function readQ() { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (_) { return []; } }
function writeQ(q) { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (_) {} }
function queue(p) { const q = readQ(); q.push(p); writeQ(q); }
async function flushQ() {
  const q = readQ(); if (!q.length) return;
  const left = [];
  for (const p of q) { if (!(await send(p))) left.push(p); }
  writeQ(left);
}
addEventListener('online', flushQ);
setInterval(flushQ, 60000);
flushQ();

function showDone(first) {
  body.innerHTML = `
    <div class="done">
      <div class="micro p-eyebrow">You're checked in</div>
      <h3 class="p-title">Thank you,<br>${esc(first)}.</h3>
      <div class="hr"></div>
      <p class="p-body">You're on the list. Expect new launches, offers and first access from us — by email and on WhatsApp.</p>
      <div class="hr"></div>
      <div class="qr-row">
        <div class="qr" id="qrRates2"></div>
        <div><div class="micro" style="color:rgba(255,255,255,.5)">Scan with your phone</div><p>Take our rate card with you.</p></div>
      </div>
      <div class="count" id="doneCount">Returning to the reel in 12s</div>
    </div>`;
  makeQR('qrRates2', RATE_CARD_URL);
  let n = 12;
  doneTimer = setInterval(() => {
    n -= 1;
    const c = $('doneCount'); if (c) c.textContent = `Returning to the reel in ${n}s`;
    if (n <= 0) { closePanel(); }
  }, 1000);
}

measure();
requestAnimationFrame(frame);
const firstImgs = [idx - 1, idx, idx + 1].map((i) => slots[i].querySelector('img'));
Promise.race([
  Promise.all(firstImgs.map((im) => im.decode().catch(() => {}))),
  new Promise((r) => setTimeout(r, 2500)),
]).then(runIntro);
</script>
</body>
</html>
